name: Retrain prediction model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain-prediction-model
  cancel-in-progress: false

jobs:
  retrain:
    name: Download data, retrain and publish model
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Download historical match data
        run: python scripts/download_football_data_csv.py

      - name: Prepare training data
        run: python -m ml.prepare_data

      - name: Retrain LightGBM model
        run: python -m ml.train_lightgbm

      - name: Run tests
        run: pytest -q

      - name: Commit trained model and evaluation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ml/models/lightgbm_model.joblib
          git add ml/models/lightgbm_metadata.json
          git add reports/lightgbm_metrics.json

          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi

          git commit -m "model: retrain LightGBM prediction model"
          git push
